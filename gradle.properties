# Pin the JDK for builds to Android Studio's bundled JBR (21).
# Without this, Gradle uses JAVA_HOME, which on this machine points at
# homebrew openjdk 26 — incompatible with the Android Gradle Plugin (jlink fails).
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
