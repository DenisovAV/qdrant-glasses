# NOTE: no `org.gradle.java.home` here, deliberately.
#
# This file is committed, so anything machine-specific in it breaks every other clone. A JDK path
# pinned here ("/Applications/Android Studio.app/...") fails outright on Linux, and on any Mac that
# installed Android Studio elsewhere or hasn't got it at all:
#     Value '...' given for org.gradle.java.home Gradle property is invalid
#
# The Android Gradle Plugin does need a JDK it accepts (17-21; a too-new JDK fails at jlink). If
# your JAVA_HOME points at one it rejects, pin it in your USER-level Gradle config — that is what
# that file is for, and it stays out of git:
#     ~/.gradle/gradle.properties
#     org.gradle.java.home=/path/to/jdk        # e.g. Android Studio's bundled JBR

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
