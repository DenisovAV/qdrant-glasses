[versions]
agp = "9.1.1"
kotlin = "2.3.21"
coreKtx = "1.18.0"
appcompat = "1.7.1"
lifecycle = "2.10.0"
camerax = "1.5.3"
# We ship the `-qnn` variant. It is NOT a superset of plain `-android` — the two are mutually
# exclusive, verified at the symbol level in the 1.26.0 AARs:
#   onnxruntime-android      exports ...AppendExecutionProvider_{CPU,Nnapi}   → NNAPI yes, QNN no
#   onnxruntime-android-qnn  exports ...AppendExecutionProvider_{CPU}         → QNN yes, NNAPI no
# You cannot have both (one libonnxruntime.so per process). We choose QNN, and it is not close —
# measured on the RayNeo X3 Pro, whole-system, both runs with the HUD dashboard ON (so both are
# inflated by the same JPEG-encode load; it is the comparison that matters, and README quotes the
# HUD-off figure, ~200ms, for the shipped path):
#   -qnn      : YOLO detect  8ms (Hexagon HTP)   | TinyCLIP  872ms (CPU)
#   -android  : YOLO detect 537ms (GPU fallback) | TinyCLIP 1351ms (NNAPI: 72/890 nodes, 48 partitions)
# Switching to -android to "get NNAPI for CLIP" loses on BOTH counts. Don't.
onnxruntime = "1.26.0"
coroutines = "1.11.0"
litert = "1.4.0"
qnn = "2.45.0"           # must be >= the QAIRT version of the qai-hub context binary (2.45)
# ObjectBox on-device vector DB — `benchmark`-flavor ONLY (VectorStoreFactory.backend=OBJECTBOX bench
# build; see app/build.gradle.kts' productFlavors). The shipping `demo` flavor pulls NONE of this: no
# ObjectBox/sqlite-vec deps, no arm64 native .so, no kapt codegen — verified against the demo APK's
# actual contents, not just the dependency scoping (see the `plugins{}` block in app/build.gradle.kts
# for how the io.objectbox Gradle plugin itself is kept flavor-clean). 5.4.2 = latest stable
# (ships database core 5.3.2); its Gradle plugin runs codegen (MyObjectBox / <Entity>_ meta) and
# packages the arm64 native lib at build time. Requires kapt — but this project uses AGP 9's
# built-in Kotlin, and org.jetbrains.kotlin.kapt is INCOMPATIBLE with built-in Kotlin, so the
# annotation processor is wired through com.android.legacy-kapt (AGP-versioned, the documented AGP-9
# kapt fallback ObjectBox's own getting-started prescribes) rather than the JetBrains kapt plugin.
objectbox = "5.4.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version = "1.9.3" }
camerax-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camerax-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android-qnn", version.ref = "onnxruntime" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }
litert-gpu = { group = "com.google.ai.edge.litert", name = "litert-gpu", version.ref = "litert" }
litert-gpu-api = { group = "com.google.ai.edge.litert", name = "litert-gpu-api", version.ref = "litert" }
qnn-runtime = { group = "com.qualcomm.qti", name = "qnn-runtime", version.ref = "qnn" }
qnn-litert-delegate = { group = "com.qualcomm.qti", name = "qnn-litert-delegate", version.ref = "qnn" }

[bundles]
camerax = ["camerax-core", "camerax-camera2", "camerax-lifecycle"]
lifecycle = ["lifecycle-viewmodel-ktx", "lifecycle-runtime-ktx"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# com.android.legacy-kapt is versioned with AGP (NOT the objectbox/kotlin version): it is AGP's own
# kapt shim that coexists with built-in Kotlin (the JetBrains kotlin-kapt plugin does not).
legacy-kapt = { id = "com.android.legacy-kapt", version.ref = "agp" }
objectbox = { id = "io.objectbox", version.ref = "objectbox" }
