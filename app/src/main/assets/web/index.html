<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qdrant Glasses — Mission Control</title>
<link rel="stylesheet" href="/static/style.css">
</head><body>
<header id="topbar">
  <span class="brand">QDRANT <b>EDGE</b></span><span class="sep">·</span>
  <span class="sub">Glasses Mission Control</span>
  <span id="mode-badge" class="badge">IDLE</span>
</header>
<main id="grid">
  <!-- Left column: live feed on top, object-memory rail below it (matches the
       edge-mission-control reference layout). -->
  <div id="left-col">
    <section id="feed-panel" class="panel">
      <div class="panel-title">LIVE FEED <span id="rec" class="rec hidden"><span class="dot"></span>REC</span></div>
      <div id="feed-wrap">
        <img id="feed" src="/stream" alt="feed">
        <canvas id="overlay"></canvas>
      </div>
      <div id="ticker">LOOP
        <span>detect <b id="t-detect">—</b></span>→
        <span>embed <b id="t-embed">—</b></span>→
        <span>store <b id="t-store">—</b></span>→
        <span>memory <b id="t-count">0</b></span>
      </div>
    </section>
    <section id="memory-panel" class="panel">
      <div class="panel-title">OBJECT MEMORY <span id="mem-count">0 objects</span></div>
      <div id="rail"></div>
    </section>
    <section id="timeline-panel" class="panel">
      <div class="panel-title">MOMENT TIMELINE <span id="moment-count">0 moments</span></div>
      <div id="timeline"></div>
    </section>
  </div>
  <!-- Right column: search panel down the side. -->
  <aside id="side">
    <section id="search-panel" class="panel">
      <div class="panel-title">SEARCH <span id="search-query"></span></div>
      <div id="results"><div class="searching">say "where is the …" to search</div></div>
    </section>
  </aside>
</main>
<script src="/static/app.js"></script>
</body></html>
